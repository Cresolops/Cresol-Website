<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRESOL | 프로젝트 상세</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="images/cresol_logo.png" alt="CRESOL 로고">
      </a>
      <nav class="nav" aria-label="메인 메뉴">
        <a href="index.html" class="nav-link">소개</a>
        <a href="project.html" class="nav-link active">프로젝트</a>
        <a href="recruitment.html" class="nav-link">모집 안내</a>
        <a href="apply.html" class="btn-apply mobile-show">지원하기</a>
      </nav>
      <a href="apply.html" class="btn-apply">지원하기</a>
      <button class="menu-toggle" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main>
    <section class="detail-hero">
      <div class="container" id="project-detail">
        <a href="project.html" class="btn-back">← 프로젝트 목록</a>
        <p class="detail-cohort" id="detail-cohort"></p>
        <h1 class="detail-title" id="detail-title"></h1>
        <p class="detail-desc" id="detail-desc"></p>
        <div class="detail-cover" id="detail-cover"></div>
        <div class="detail-gallery" id="detail-gallery"></div>
        <div class="detail-members" id="detail-members" hidden>
          <h3>팀원</h3>
          <p id="detail-members-text"></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-logo">
        <img src="images/cresol_Framelogo.png" alt="CRESOL">
      </div>
      <div class="footer-sns">
        <a href="mailto:cresolops@gmail.com" aria-label="이메일 문의">
          <img src="images/mail_logo.png" alt="메일">
        </a>
        <a href="https://www.instagram.com/cresol_/" target="_blank" rel="noopener" aria-label="인스타그램">
          <img src="images/instargram_logo.png" alt="인스타그램">
        </a>
        <a href="https://cafe.naver.com/cresol" target="_blank" rel="noopener" aria-label="네이버 카페">
          <img src="images/navercafe_logo.png" alt="네이버 카페">
        </a>
      </div>
    </div>
  </footer>

  <script src="js/projects-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRESOL | 프로젝트 상세</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="images/cresol_logo.png" alt="CRESOL 로고">
      </a>
      <nav class="nav" aria-label="메인 메뉴">
        <a href="index.html" class="nav-link">소개</a>
        <a href="project.html" class="nav-link active">프로젝트</a>
        <a href="recruitment.html" class="nav-link">모집 안내</a>
      </nav>
      <a href="apply.html" class="btn-apply">지원하기</a>
      <button class="menu-toggle" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main class="project-detail-container">
  <!-- 프로젝트 목록 이동 버튼 -->
  <a href="project.html" class="back-btn">
    ←
  </a>
    <!-- 상단 레이아웃: 제목 -> 세부설명 -> (기수 + 팀원) -->
    <div class="detail-header">
      <h1 class="detail-title">프로젝트 제목</h1>
      <p class="detail-desc">프로젝트 설명이 들어갑니다.</p>
      <div class="detail-meta">
        <span class="detail-cohort">00기</span>
        <span class="detail-members">팀원 이름</span>
      </div>
    </div>

    <!-- 하단 레이아웃: 마우스 휠 스크롤 시 양옆 이동 갤러리 (부모 컨테이너로 감쌈) -->
    <div class="detail-gallery-container">
      <div class="detail-gallery-wrapper">
        <div class="detail-gallery" id="detail-gallery">
          <!-- JS로 <img> 요소들이 추가됩니다 -->
        </div>
      </div>
    </div>
</main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-logo">
        <img src="images/cresol_footerlogo.png" alt="CRESOL">
        <a class="footer-copyright">© 2019-2026 cresol. All rights reserved.</a>
        <a href="mailto:cresol_@naver.com" class="footer-email">cresol_@naver.com</a>
      </div>
      <div class="footer-sns">
        <a href="https://mail.google.com/mail/?view=cm&fs=1&to=cresol_@naver.com" id="email-copy-btn" target="_blank" rel="noopener" aria-label="이메일 문의">
          <img src="images/mail_logo.svg" alt="메일">
        </a>
        <a href="https://www.instagram.com/cresol_/" target="_blank" rel="noopener" aria-label="인스타그램">
          <img src="images/instargram_logo.svg" alt="인스타그램">
        </a>
        <a href="https://cafe.naver.com/cresol" target="_blank" rel="noopener" aria-label="네이버 카페">
          <img src="images/navercafe_logo.svg" alt="네이버 카페">
        </a>
      </div>
    </div>
  </footer>

  <script src="js/projects-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="css/main.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="images/cresol_logo.png" alt="CRESOL 로고">
      </a>

      <nav class="nav" aria-label="메인 메뉴">
        <div class="nav-item has-dropdown">
          <a href="index.html" class="nav-link">소개</a>
          <div class="nav-dropdown">
            <a href="index.html#hero">메인 슬로건 카피</a>
            <a href="index.html#stats">누적 학회원 수</a>
            <a href="index.html#vision">비전 소개 글 + 활동 사진</a>
          </div>
        </div>
        <div class="nav-item has-dropdown">
          <a href="project.html" class="nav-link">프로젝트</a>
          <div class="nav-dropdown">
            <a href="project.html#filter">기수별 필터링</a>
            <a href="project.html#projects">표지+타이틀+설명</a>
          </div>
        </div>
        <div class="nav-item has-dropdown">
          <a href="recruitment.html" class="nav-link">모집 안내</a>
          <div class="nav-dropdown">
            <a href="recruitment.html#faq">FAQ</a>
            <a href="recruitment.html#schedule">학기 일정</a>
            <a href="apply.html">지원하기</a>
          </div>
        </div>
      </nav>

      <div class="apply-dropdown-wrap">
        <a href="apply.html" class="btn-apply">지원하기</a>
      </div>

      <button class="menu-toggle" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1 class="page-title">CRESOL 지원서</h1>
        <p class="section-subtitle">
          아래 양식을 작성하여 제출해 주세요. 작성 중인 내용은 브라우저에 자동 임시저장됩니다.
        </p>
        <p id="autosave-status" class="autosave-status" aria-live="polite"></p>
      </div>
    </section>

    <section class="section apply-form-section">
      <div class="container">
        <form id="apply-form" class="apply-form" novalidate>

          <fieldset class="form-fieldset">
            <legend class="form-legend">기본 정보</legend>

            <div class="form-group">
              <label for="name" class="form-label">이름 <span class="required">*</span></label>
              <input type="text" id="name" name="name" class="form-input" placeholder="홍길동" autocomplete="name" required>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="email" class="form-label">이메일 <span class="required">*</span></label>
                <input type="email" id="email" name="email" class="form-input" placeholder="example@email.com" autocomplete="email" required>
              </div>
              <div class="form-group">
                <label for="phone" class="form-label">전화번호 <span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" class="form-input" placeholder="010-1234-5678" autocomplete="tel" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="university" class="form-label">학교 <span class="required">*</span></label>
                <input type="text" id="university" name="university" class="form-input" placeholder="OO대학교" required>
              </div>
              <div class="form-group">
                <label for="major" class="form-label">학과 <span class="required">*</span></label>
                <input type="text" id="major" name="major" class="form-input" placeholder="OO학과" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="grade" class="form-label">학년 <span class="required">*</span></label>
                <select id="grade" name="grade" class="form-input" required>
                  <option value="">선택해 주세요</option>
                  <option value="1학년">1학년</option>
                  <option value="2학년">2학년</option>
                  <option value="3학년">3학년</option>
                  <option value="4학년">4학년</option>
                  <option value="휴학생">휴학생</option>
                  <option value="졸업생">졸업생</option>
                </select>
              </div>
              <div class="form-group">
                <label for="applyType" class="form-label">지원 구분 <span class="required">*</span></label>
                <select id="applyType" name="applyType" class="form-input" required>
                  <option value="">선택해 주세요</option>
                  <option value="학회원">학회원</option>
                  <option value="운영진">운영진</option>
                </select>
              </div>
            </div>
          </fieldset>

          <fieldset class="form-fieldset">
            <legend class="form-legend">지원 내용</legend>

            <div class="form-group">
              <label for="motivation" class="form-label">지원동기 <span class="required">*</span></label>
              <textarea id="motivation" name="motivation" class="form-textarea" rows="6"
                placeholder="CRESOL에 지원하게 된 동기와 함께하고 싶은 활동을 작성해 주세요." required></textarea>
            </div>

            <div class="form-group">
              <label for="experience" class="form-label">활동 및 프로젝트 경험</label>
              <textarea id="experience" name="experience" class="form-textarea" rows="5"
                placeholder="관련 활동, 프로젝트, 동아리 경험 등을 자유롭게 작성해 주세요. (선택)"></textarea>
            </div>

            <div class="form-group">
              <label for="portfolio" class="form-label">포트폴리오 URL</label>
              <input type="url" id="portfolio" name="portfolio" class="form-input"
                placeholder="https:// (선택)">
            </div>
          </fieldset>

          <fieldset class="form-fieldset">
            <legend class="form-legend">동의</legend>
            <label class="form-checkbox-label">
              <input type="checkbox" id="privacyAgree" name="privacyAgree" required>
              <span>개인정보 수집 및 이용에 동의합니다. <span class="required">*</span></span>
            </label>
            <p class="form-help">
              수집 항목: 이름, 이메일, 전화번호, 학교, 학과, 학년, 지원 내용<br>
              이용 목적: CRESOL 학회원 모집 및 선발<br>
              보유 기간: 모집 종료 후 1년
            </p>
          </fieldset>

          <p id="form-message" class="form-message" role="alert"></p>

          <div class="form-actions">
            <button type="button" id="clear-draft-btn" class="btn-form-secondary">임시저장 비우기</button>
            <button type="submit" id="submit-btn" class="btn-form-primary">최종 제출</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-logo">
        <img src="images/cresol_Framelogo.png" alt="CRESOL">
      </div>
      <div class="footer-sns">
        <a href="https://cafe.naver.com" target="_blank" rel="noopener" aria-label="네이버 카페">
          <img src="images/navercafe_logo.jpeg" alt="네이버 카페">
        </a>
        <a href="https://instagram.com" target="_blank" rel="noopener" aria-label="인스타그램">
          <img src="images/instargram_logo.jpeg" alt="인스타그램">
        </a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/apply.js"></script>
</body>
</html>

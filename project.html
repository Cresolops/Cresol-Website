<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRESOL | 프로젝트</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
</head>
<body>

  <!-- GNB -->
  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="images/cresol_logo.png" alt="CRESOL 로고">
      </a>

      <nav class="nav" aria-label="메인 메뉴">
        <div class="nav-item has-dropdown">
          <a href="index.html" class="nav-link">소개</a>
          <div class="nav-dropdown">
            <a href="index.html#hero">메인 슬로건 카피</a>
            <a href="index.html#stats">누적 학회원 수</a>
            <a href="index.html#stats">운영 기수</a>
            <a href="index.html#vision">비전 소개 글 + 활동 사진</a>
            <a href="index.html#schedule">학회 일정</a>
          </div>
        </div>
        <div class="nav-item has-dropdown">
          <a href="project.html" class="nav-link active">프로젝트</a>
          <div class="nav-dropdown">
            <a href="#filter">기수별 필터링</a>
            <a href="#projects">표지+타이틀+설명</a>
            <a href="#projects">운영 기수</a>
          </div>
        </div>
        <div class="nav-item has-dropdown">
          <a href="recruitment.html" class="nav-link">모집 안내</a>
          <div class="nav-dropdown">
            <a href="recruitment.html#faq">FAQ</a>
            <a href="recruitment.html#schedule">학기 일정</a>
            <a href="recruitment.html#apply">지원 알림받기 / 지원하기</a>
          </div>
        </div>
      </nav>

      <div class="apply-dropdown-wrap">
        <a href="recruitment.html#apply" class="btn-apply">지원하기</a>
        <div class="nav-dropdown">
          <a href="recruitment.html#apply-staff">8월 모집 안내 운영진</a>
          <a href="recruitment.html#apply-member">8월 모집 안내 학회원</a>
          <a href="recruitment.html#schedule">학기 일정</a>
          <a href="recruitment.html#apply">지원 버튼</a>
          <a href="recruitment.html#apply-form">양식 다운 및 메일 주소</a>
        </div>
      </div>

      <button class="menu-toggle" aria-label="메뉴 열기">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1 class="page-title">프로젝트</h1>
        <div class="filter-select" id="filter">
          <label for="cohort-filter">기수별 필터링</label>
          <select id="cohort-filter" aria-label="기수 선택">
            <option value="all">전체 기수</option>
            <option value="16">16기</option>
            <option value="15">15기</option>
            <option value="14">14기</option>
          </select>
        </div>
      </div>
    </section>

    <section id="projects">
      <div class="container">
        <div class="project-grid" id="project-grid">
          <!-- JS renders project cards -->
        </div>
        <nav class="pagination" id="pagination" aria-label="페이지 네비게이션"></nav>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-logo">
        <img src="images/cresol_Framelogo.png" alt="CRESOL">
      </div>
      <div class="footer-sns">
        <a href="https://cafe.naver.com/cresol" target="_blank" rel="noopener" aria-label="네이버 카페">
          <img src="images/navercafe_logo.png" alt="네이버 카페">
        </a>
        <a href="https://www.instagram.com/cresol_/" target="_blank" rel="noopener" aria-label="인스타그램">
          <img src="images/instargram_logo.png" alt="인스타그램">
        </a>
      </div>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRESOL | 프로젝트</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <img src="images/cresol_logo.png" alt="CRESOL 로고">
      </a>
      <nav class="nav" aria-label="메인 메뉴">
        <a href="index.html" class="nav-link">소개</a>
        <a href="project.html" class="nav-link active">프로젝트</a>
        <a href="recruitment.html" class="nav-link">모집 안내</a>
      </nav>
      <a href="apply.html" class="btn-apply">지원하기</a>
      <button class="menu-toggle" aria-label="메뉴 열기"><span></span><span></span><span></span></button>
    </div>
  </header>

  <main>
    <section class="page-header">
      <div class="container">
        <h1 class="page-title">프로젝트</h1>
        <div class="filter-select" id="filter">
          <!-- 선택된 값을 보여주는 버튼 -->
          <button type="button" class="filter-btn" id="cohort-filter-btn" aria-expanded="false">
            <span class="selected-value">전체 기수</span>
            <span class="arrow"><img src="images/드롭다운_아래.png" alt="드롭다운_아래"></span>
          </button>
          
          <!-- 드롭다운 옵션 목록 -->
          <ul class="filter-dropdown" id="cohort-dropdown">
            <li data-value="all" class="selected">전체 기수</li>
            <li data-value="15">15기</li>
            <li data-value="14">14기</li>
            <li data-value="13">13기</li>
            <li data-value="12">12기</li>
            <li data-value="11">11기</li>
            <li data-value="10">10기</li>
            <li data-value="9">9기</li>
            <li data-value="8">8기</li>
            <li data-value="7">7기</li>
            <li data-value="6">6기</li>
            <li data-value="5">5기</li>
            <li data-value="4">4기</li>
            <li data-value="3">3기</li>
          </ul>
        </div>
      </div>
    </section>

    <section id="projects">
      <div class="container">
        <div class="project-grid" id="project-grid"></div>
        <nav class="pagination" id="pagination" aria-label="페이지 네비게이션"></nav>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div class="footer-logo">
        <img src="images/cresol_footerlogo.png" alt="CRESOL">
        <a class="footer-copyright">© 2019-2026 cresol. All rights reserved.</a>
        <a href="mailto:cresol_@naver.com" class="footer-email">cresol_@naver.com</a>
      </div>
      <div class="footer-sns">
        <a href="https://mail.google.com/mail/?view=cm&fs=1&to=cresol_@naver.com" id="email-copy-btn" target="_blank" rel="noopener" aria-label="이메일 문의">
          <img src="images/mail_logo.svg" alt="메일">
        </a>
        <a href="https://www.instagram.com/cresol_/" target="_blank" rel="noopener" aria-label="인스타그램">
          <img src="images/instargram_logo.svg" alt="인스타그램">
        </a>
        <a href="https://cafe.naver.com/cresol" target="_blank" rel="noopener" aria-label="네이버 카페">
          <img src="images/navercafe_logo.svg" alt="네이버 카페">
        </a>
      </div>
    </div>
  </footer>

  <script src="js/projects-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
